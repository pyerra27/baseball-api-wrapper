[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baseball-api-wrapper"
version = "0.1.0"
description = "A Python wrapper for the official MLB Stats API (https://statsapi.mlb.com)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.32.4",  # Floor excludes CVE-2023-32681, CVE-2024-35195, CVE-2024-47081
]

[project.optional-dependencies]
# Install dev/test tools with: pip install -e ".[dev]"
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "ruff==0.17.2",      # Lint: import order + unused imports
]

[tool.setuptools.packages.find]
# Automatically discover all packages (baseball_api_wrapper and sub-packages)
where = ["."]
include = ["baseball_api_wrapper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["baseball_api_wrapper"]
omit = ["tests/*"]

[tool.ruff.lint]
# Check only (no --fix): import sorting/grouping (I) and unused imports (F401)
select = ["I", "F401"]
